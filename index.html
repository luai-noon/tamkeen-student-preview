<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>معامل نون</title>
    <script>
      // The page's own files (splash image, player, opening) are relative to the app's address. A link without its
      // closing slash (…/students) would put them one level up, so the address always counts as the folder.
      (function () {
        var b = document.createElement('base');
        b.href = location.pathname.replace(/\/?$/, '/');
        document.head.appendChild(b);
      })();
    </script>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* The phone's splash (app.json: splash-icon.png, 192 wide, white), then the opening drawn over it at 1 px per
         unit and centred, as ui/BootSplash.tsx draws it, so the app can take the same player over without a jump. */
      #native-splash {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #ffffff;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #native-splash img {
        width: 192px;
        height: auto;
      }
      #opening {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 440px;
        height: 1000px;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="native-splash"><img id="splash-image" src="splash-icon.png" alt="" /><div id="opening"></div></div>
    <div id="root"></div>
    <!-- Both copied in by scripts/web-files.js. -->
    <script src="lottie_light.min.js"></script>
    <script>
      // The opening's simmer starts here, before the app's script has loaded: the same file and player the app uses
      // (ui/Lottie.web.tsx), which takes this player over and decides when it boils over, as ui/BootSplash.tsx does.
      (function () {
        var box = document.getElementById('opening');
        if (!window.lottie || !box) return;
        var anim = lottie.loadAnimation({ container: box, renderer: 'svg', loop: false, autoplay: false, path: 'opening.json' });
        var opening = (window.__opening = { anim: anim, box: box, loaded: false, adopted: false });
        var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        function simmer() {
          var m = (anim.animationData.markers || []).filter(function (x) { return x.cm === 'simmer'; })[0];
          if (m) anim.playSegments([m.tm, m.tm + m.dr], true);
        }
        anim.addEventListener('DOMLoaded', function () {
          opening.loaded = true;
          document.getElementById('splash-image').style.visibility = 'hidden';
          if (!opening.adopted && !still) {
            simmer();
            if (performance.mark) performance.mark('opening-simmer');
          }
        });
        anim.addEventListener('complete', function () {
          if (!opening.adopted) simmer();
        });
      })();
    </script>
  <script src="/tamkeen-student-preview/_expo/static/js/web/index-642200717e2d6a9e908ce0c091ae1607.js" defer></script>
</body>
</html>
